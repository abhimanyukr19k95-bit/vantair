<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page Not Found — Vantair</title>
<link rel="stylesheet" href="css/styles.css"/>
<style>
.notfound-wrap { min-height:80vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 20px; }
.notfound-inner { max-width:560px; }
.notfound-num { font-family:'Playfair Display',serif; font-size:8rem; font-weight:700; color:var(--blue); line-height:1; margin-bottom:8px; opacity:0.15; }
.notfound-icon { font-size:4rem; margin-bottom:20px; margin-top:-60px; }
.notfound-title { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; margin-bottom:12px; }
.notfound-sub { font-size:1rem; color:var(--ink-2); line-height:1.7; margin-bottom:36px; }
.notfound-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.quick-links { margin-top:48px; }
.quick-links h4 { font-size:0.82rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:16px; }
.quick-link-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.quick-link { font-size:0.86rem; color:var(--blue); padding:8px 16px; border-radius:var(--radius-pill); background:var(--blue-light); transition:background var(--transition); }
.quick-link:hover { background:#cdd9f5; }
</style>
</head>
<body>
<div id="page-loader"></div>
<div id="ann-bar"></div>
<div id="lc-bar"></div>
<header id="navbar"></header>
<div id="mobile-nav"></div>

<div class="notfound-wrap">
  <div class="notfound-inner reveal">
    <div class="notfound-num">404</div>
    <div class="notfound-icon">🔍</div>
    <h1 class="notfound-title">Page Not Found</h1>
    <p class="notfound-sub">Oops! The page you're looking for seems to have wandered off. It may have been moved, deleted or the URL might be incorrect.</p>
    <div class="notfound-actions">
      <a href="index.html" class="btn btn-primary">🏠 Back to Home</a>
      <a href="shop.html" class="btn btn-secondary">🛍️ Shop Products</a>
    </div>
    <div class="quick-links">
      <h4>Quick Links</h4>
      <div class="quick-link-row">
        <a href="shop.html?cat=perfumes" class="quick-link">🌸 Perfumes</a>
        <a href="shop.html?cat=skincare" class="quick-link">✨ Skin Care</a>
        <a href="shop.html?cat=cosmetics" class="quick-link">💄 Cosmetics</a>
        <a href="shop.html?cat=toiletries" class="quick-link">🚿 Toiletries</a>
        <a href="contact.html" class="quick-link">📞 Contact</a>
        <a href="faq.html" class="quick-link">❓ FAQ</a>
      </div>
    </div>
  </div>
</div>

<footer id="footer"></footer>
<a id="wa-float" target="_blank"></a>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
</body>
</html>

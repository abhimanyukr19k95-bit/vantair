<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign In — Vantair</title>
<link rel="stylesheet" href="css/styles.css"/>
<style>
.auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; background:linear-gradient(135deg,#001a80,#0033CC); }
.auth-card { background:var(--surface); border-radius:var(--radius-xl); padding:48px 44px; width:100%; max-width:440px; box-shadow:0 32px 80px rgba(0,0,0,0.25); }
.auth-logo { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:32px; }
.auth-logo img { width:44px; height:44px; border-radius:10px; }
.auth-logo span { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:700; color:var(--blue); letter-spacing:0.08em; }
.auth-title { font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:700; text-align:center; margin-bottom:6px; }
.auth-sub { font-size:0.86rem; color:var(--ink-2); text-align:center; margin-bottom:32px; }
.show-pw-row { display:flex; align-items:center; justify-content:space-between; margin-top:-12px; margin-bottom:16px; }
.show-pw-row label { font-size:0.78rem; color:var(--ink-2); cursor:pointer; display:flex; align-items:center; gap:6px; }
.forgot-link { font-size:0.78rem; color:var(--blue); cursor:pointer; }
.auth-switch { text-align:center; font-size:0.86rem; color:var(--ink-2); margin-top:24px; }
.auth-switch a { color:var(--blue); font-weight:600; }
.divider-line { height:1px; background:var(--silver-2); margin:24px 0; }
.guest-btn { width:100%; padding:12px; border:1.5px solid rgba(0,0,0,0.1); border-radius:var(--radius-pill); font-size:0.88rem; font-weight:500; color:var(--ink); background:var(--surface); cursor:pointer; transition:all var(--transition); text-align:center; display:block; }
.guest-btn:hover { border-color:var(--blue); color:var(--blue); }
</style>
</head>
<body>
<div id="page-loader"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo.jpg" alt="Vantair">
      <span>VANTAIR</span>
    </div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Sign in to your Vantair account</p>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')handleSignIn()">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" onkeydown="if(event.key==='Enter')handleSignIn()">
    </div>
    <div class="show-pw-row">
      <label><input type="checkbox" onchange="togglePW(this)" style="accent-color:var(--blue);"> Show password</label>
      <span class="forgot-link" onclick="handleForgot()">Forgot password?</span>
    </div>

    <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <input type="checkbox" id="remember" style="accent-color:var(--blue);width:16px;height:16px;">
      <label for="remember" style="font-size:0.84rem;color:var(--ink-2);text-transform:none;letter-spacing:0;">Remember me</label>
    </div>

    <div id="signin-error" style="color:var(--error);font-size:0.82rem;margin-bottom:12px;display:none;"></div>

    <button class="btn btn-primary btn-full" onclick="handleSignIn()">Sign In →</button>

    <div class="divider-line"></div>
    <a href="shop.html" class="guest-btn">Continue as Guest</a>

    <div class="auth-switch">Don't have an account? <a href="signup.html">Create Account</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script>
function togglePW(cb) {
  document.getElementById('password').type = cb.checked ? 'text' : 'password';
}
function handleForgot() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showToast('Please enter your email first', 'error'); return; }
  showToast('Password reset link sent to ' + email, 'success');
}
async function handleSignIn() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('signin-error');
  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; errEl.style.display='block'; return; }

  const btn = document.querySelector('.btn-primary.btn-full');
  const prev = btn.textContent; btn.textContent = 'Signing in…'; btn.disabled = true;

  const result = await signIn(email, password);
  if (!result.success) {
    errEl.textContent = result.error; errEl.style.display='block';
    btn.textContent = prev; btn.disabled = false;
    return;
  }
  if (document.getElementById('remember').checked) localStorage.setItem('vantair_remember_email', email);
  else localStorage.removeItem('vantair_remember_email');

  const redirect = new URLSearchParams(window.location.search).get('redirect');
  window.location.href = redirect || 'account.html';
}
// Auto fill if remember me was used
const savedEmail = localStorage.getItem('vantair_remember_email');
if (savedEmail) document.getElementById('email').value = savedEmail;
</script>
</body>
</html>

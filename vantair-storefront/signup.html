<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign Up — Vantair</title>
<link rel="stylesheet" href="css/styles.css"/>
<style>
.auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; background:linear-gradient(135deg,#001a80,#0033CC); }
.auth-card { background:var(--surface); border-radius:var(--radius-xl); padding:44px 40px; width:100%; max-width:520px; box-shadow:0 32px 80px rgba(0,0,0,0.25); }
.auth-logo { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:28px; }
.auth-logo img { width:44px; height:44px; border-radius:10px; }
.auth-logo span { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:700; color:var(--blue); letter-spacing:0.08em; }
.auth-title { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:700; text-align:center; margin-bottom:6px; }
.auth-sub { font-size:0.86rem; color:var(--ink-2); text-align:center; margin-bottom:28px; }
.photo-upload { display:flex; flex-direction:column; align-items:center; margin-bottom:20px; }
.photo-preview { width:72px; height:72px; border-radius:50%; background:var(--blue-light); border:2px dashed var(--blue); display:flex; align-items:center; justify-content:center; font-size:1.8rem; cursor:pointer; overflow:hidden; margin-bottom:8px; transition:border-color var(--transition); }
.photo-preview:hover { border-color:var(--blue-dark); }
.photo-preview img { width:100%; height:100%; object-fit:cover; }
.photo-label { font-size:0.76rem; color:var(--ink-2); cursor:pointer; }
.auth-divider { display:flex; align-items:center; gap:12px; margin:20px 0; }
.auth-divider::before,.auth-divider::after { content:''; flex:1; height:1px; background:var(--silver-2); }
.auth-divider span { font-size:0.76rem; color:var(--ink-3); }
.auth-switch { text-align:center; font-size:0.86rem; color:var(--ink-2); margin-top:20px; }
.auth-switch a { color:var(--blue); font-weight:600; }
</style>
</head>
<body>
<div id="page-loader"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo.jpg" alt="Vantair">
      <span>VANTAIR</span>
    </div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Join Vantair for exclusive offers and order tracking</p>

    <div class="photo-upload">
      <div class="photo-preview" id="photo-preview" onclick="document.getElementById('photo-input').click()">📷</div>
      <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="handlePhoto(this)">
      <label class="photo-label" onclick="document.getElementById('photo-input').click()">Upload Profile Photo (optional)</label>
    </div>

    <div class="form-row">
      <div class="form-group"><label>First Name</label><input type="text" id="fname" placeholder="First name"></div>
      <div class="form-group"><label>Last Name</label><input type="text" id="lname" placeholder="Last name"></div>
    </div>
    <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="your@email.com"></div>
    <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" placeholder="+91 XXXXX XXXXX"></div>
    <div class="form-row">
      <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Min 8 characters"></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="confirm-pw" placeholder="Repeat password"></div>
    </div>

    <div class="auth-divider"><span>Delivery Address (optional)</span></div>

    <div class="form-group"><label>Address Line</label><input type="text" id="address" placeholder="House no, Street, Area"></div>
    <div class="form-row">
      <div class="form-group"><label>City</label><input type="text" id="city" placeholder="City"></div>
      <div class="form-group"><label>Pincode</label><input type="text" id="pincode" maxlength="6" placeholder="Pincode"></div>
    </div>
    <div class="form-group"><label>State</label><input type="text" id="state" placeholder="State"></div>

    <div class="form-group" style="display:flex;align-items:center;gap:10px;margin-top:4px;">
      <input type="checkbox" id="newsletter" style="accent-color:var(--blue);width:16px;height:16px;">
      <label for="newsletter" style="font-size:0.84rem;color:var(--ink-2);text-transform:none;letter-spacing:0;">Subscribe to offers & updates</label>
    </div>

    <div id="signup-error" style="color:var(--error);font-size:0.82rem;margin-bottom:12px;display:none;"></div>

    <button class="btn btn-primary btn-full" onclick="handleSignUp()">Create Account →</button>

    <div class="auth-switch">Already have an account? <a href="signin.html">Sign In</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script>
let photoBase64 = null;

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    photoBase64 = e.target.result;
    const preview = document.getElementById('photo-preview');
    preview.innerHTML = `<img src="${photoBase64}" alt="Photo">`;
  };
  reader.readAsDataURL(file);
}

async function handleSignUp() {
  const fname = document.getElementById('fname').value.trim();
  const lname = document.getElementById('lname').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm-pw').value;
  const errEl = document.getElementById('signup-error');

  if (!fname || !email || !phone || !password) { errEl.textContent = 'Please fill in all required fields.'; errEl.style.display='block'; return; }
  if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display='block'; return; }
  if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; errEl.style.display='block'; return; }

  const btn = document.querySelector('.btn-primary.btn-full');
  const prev = btn.textContent; btn.textContent = 'Creating account…'; btn.disabled = true;

  const result = await signUp({
    name: fname + ' ' + lname,
    email, phone, password,
    photo: photoBase64,
    address: document.getElementById('address').value.trim(),
    city: document.getElementById('city').value.trim(),
    state: document.getElementById('state').value.trim(),
    pincode: document.getElementById('pincode').value.trim(),
    newsletter: document.getElementById('newsletter').checked
  });

  if (!result.success) {
    errEl.textContent = result.error; errEl.style.display='block';
    btn.textContent = prev; btn.disabled = false;
    return;
  }

  const redirect = new URLSearchParams(window.location.search).get('redirect');
  window.location.href = redirect || 'account.html';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Delivery Validation — Vantair</title>
<link rel="stylesheet" href="css/styles.css"/>
<style>
.validate-wrap { max-width:480px; margin:60px auto; padding:0 20px; }
.validate-card { background:var(--surface); border-radius:var(--radius-xl); padding:40px; box-shadow:var(--shadow-lg); text-align:center; }
.validate-icon { width:64px; height:64px; border-radius:50%; background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 20px; }
.validate-title { font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:700; margin-bottom:8px; }
.validate-sub { font-size:0.86rem; color:var(--ink-2); margin-bottom:28px; }
.result-valid { background:#d1fae5; border-radius:var(--radius-lg); padding:24px; text-align:center; }
.result-invalid { background:#fee2e2; border-radius:var(--radius-lg); padding:24px; text-align:center; }
</style>
</head>
<body>
<div id="page-loader"></div>
<div id="ann-bar"></div>
<div id="lc-bar"></div>
<header id="navbar"></header>
<div id="mobile-nav"></div>
<div class="validate-wrap">
  <div class="validate-card">
    <div class="validate-icon">🚚</div>
    <h1 class="validate-title">Delivery Verification</h1>
    <p class="validate-sub">For Vantair Delivery Agents Only. Enter the Order ID and customer's OTP to verify delivery.</p>
    <div class="form-group" style="text-align:left;"><label>Order ID</label><input type="text" id="val-order-id" placeholder="e.g. VNT12345678"></div>
    <div class="form-group" style="text-align:left;"><label>Customer OTP (6 digits)</label><input type="text" id="val-otp" maxlength="6" placeholder="000000" style="letter-spacing:0.3em;font-size:1.2rem;text-align:center;"></div>
    <button class="btn btn-primary btn-full" onclick="validateDelivery()">✓ Validate Delivery</button>
    <div id="val-result" style="margin-top:20px;"></div>
  </div>
</div>
<footer id="footer"></footer>
<a id="wa-float" target="_blank"></a>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/otp.js"></script>
<script src="js/components.js"></script>
<script>
async function validateDelivery() {
  const orderId = document.getElementById('val-order-id').value.trim();
  const otp = document.getElementById('val-otp').value.trim();
  const res = document.getElementById('val-result');
  if (!orderId || otp.length !== 6) { res.innerHTML = '<p style="color:var(--error);">Please enter Order ID and 6-digit OTP</p>'; return; }
  const result = await validateAgentOTP(orderId, otp);
  if (result.valid) {
    res.innerHTML = `<div class="result-valid"><div style="font-size:3rem;">✅</div><h3 style="font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:#065f46;margin:12px 0 8px;">OTP VERIFIED</h3><p style="font-size:0.88rem;color:#047857;">Customer identity confirmed. Please hand over the package.</p><p style="font-size:0.8rem;color:#065f46;margin-top:8px;">Order: #${orderId}</p></div>`;
  } else {
    res.innerHTML = `<div class="result-invalid"><div style="font-size:3rem;">❌</div><h3 style="font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:#991b1b;margin:12px 0 8px;">INVALID OTP</h3><p style="font-size:0.88rem;color:#b91c1c;">${result.error}</p><p style="font-size:0.8rem;color:#991b1b;margin-top:8px;">Do NOT deliver. Contact support.</p></div>`;
  }
}
</script>
</body>
</html>

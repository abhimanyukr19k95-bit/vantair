<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Account — Vantair</title>
<link rel="stylesheet" href="css/styles.css"/>
<style>
.acc-panel { background:var(--surface); border-radius:var(--radius-lg); padding:28px; box-shadow:var(--shadow-sm); }
.acc-panel-title { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:700; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--silver-2); }
.order-item { border:1.5px solid rgba(0,0,0,0.08); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px; transition:border-color var(--transition); }
.order-item:hover { border-color:var(--blue); }
.order-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.order-id { font-weight:700; font-size:0.9rem; color:var(--ink); }
.order-date { font-size:0.76rem; color:var(--ink-3); }
.order-status { font-size:0.76rem; font-weight:600; padding:4px 12px; border-radius:var(--radius-pill); }
.status-confirmed { background:#dbeafe; color:#1e40af; }
.status-shipped   { background:#fff7ed; color:#c2410c; }
.status-delivered { background:#d1fae5; color:#065f46; }
.status-cancelled { background:#fee2e2; color:#991b1b; }
.order-products { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.order-prod-chip { display:flex; align-items:center; gap:6px; background:var(--bg); border-radius:var(--radius-sm); padding:6px 10px; font-size:0.78rem; }
.order-footer { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
.order-total { font-weight:700; font-size:0.95rem; }
.order-actions { display:flex; gap:8px; }

.addr-manage-card { border:1.5px solid rgba(0,0,0,0.1); border-radius:var(--radius-md); padding:16px; position:relative; margin-bottom:12px; }
.addr-manage-card.default-addr { border-color:var(--blue); background:var(--blue-light); }
.default-badge { font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--blue); margin-bottom:6px; }

.profile-photo-wrap { display:flex; align-items:center; gap:20px; margin-bottom:28px; }
.profile-photo-big { width:80px; height:80px; border-radius:50%; background:var(--blue-light); border:3px solid var(--blue); display:flex; align-items:center; justify-content:center; font-size:2rem; overflow:hidden; cursor:pointer; }
.profile-photo-big img { width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<div id="page-loader"></div>
<div id="ann-bar"></div>
<div id="lc-bar"></div>
<header id="navbar"></header>
<div id="mobile-nav"></div>

<div class="account-layout">
  <!-- SIDEBAR -->
  <aside class="account-sidebar">
    <div class="account-sidebar-header">
      <div class="account-avatar" id="sidebar-avatar">U</div>
      <div class="account-name" id="sidebar-name">Loading...</div>
      <div class="account-email" id="sidebar-email"></div>
    </div>
    <nav class="account-nav">
      <div class="account-nav-link active" id="nav-profile"  onclick="showPanel('profile')"><span class="nav-link-icon">👤</span> Profile</div>
      <div class="account-nav-link" id="nav-orders"   onclick="showPanel('orders')"><span class="nav-link-icon">📦</span> My Orders</div>
      <div class="account-nav-link" id="nav-addresses" onclick="showPanel('addresses')"><span class="nav-link-icon">📍</span> Addresses</div>
      <div class="account-nav-link" id="nav-wishlist" onclick="window.location.href='wishlist.html'"><span class="nav-link-icon">❤️</span> Wishlist</div>
      <div class="account-nav-link" id="nav-coupons"  onclick="showPanel('coupons')"><span class="nav-link-icon">🏷️</span> My Coupons</div>
      <div class="account-nav-link" id="nav-security" onclick="showPanel('security')"><span class="nav-link-icon">🔐</span> Security</div>
      <div class="account-nav-link" style="color:var(--error);" onclick="signOut()"><span class="nav-link-icon">🚪</span> Sign Out</div>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="account-main"></main>
</div>

<footer id="footer"></footer>
<a id="wa-float" target="_blank"></a>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/otp.js"></script>
<script src="js/components.js"></script>
<script>
let currentUser = null;
let userOrders = [];

async function init() {
  currentUser = getCurrentUser();
  if (!currentUser) { window.location.href = 'signin.html?redirect=account.html'; return; }
  // Refresh user (profile, addresses, refund coupons) from the API.
  if (typeof refreshSessionUser === 'function') {
    const fresh = await refreshSessionUser();
    if (fresh) currentUser = fresh;
  }
  loadSidebar();
  const hash = window.location.hash.replace('#','') || 'profile';
  showPanel(hash);
}

function loadSidebar() {
  const av = document.getElementById('sidebar-avatar');
  if (currentUser.photo) av.innerHTML = `<img src="${currentUser.photo}">`;
  else av.textContent = currentUser.name ? currentUser.name[0].toUpperCase() : 'U';
  document.getElementById('sidebar-name').textContent = currentUser.name || 'My Account';
  document.getElementById('sidebar-email').textContent = currentUser.email || '';
}

function showPanel(panel) {
  document.querySelectorAll('.account-nav-link').forEach(l => l.classList.remove('active'));
  const navEl = document.getElementById('nav-' + panel);
  if (navEl) navEl.classList.add('active');
  window.location.hash = panel;
  const main = document.getElementById('account-main');
  if (panel === 'profile')   main.innerHTML = buildProfile();
  if (panel === 'orders')    loadOrdersPanel(main);
  if (panel === 'addresses') main.innerHTML = buildAddresses();
  if (panel === 'coupons')   main.innerHTML = buildCoupons();
  if (panel === 'security')  main.innerHTML = buildSecurity();
}

async function loadOrdersPanel(main) {
  main.innerHTML = `<div class="acc-panel"><div class="acc-panel-title">My Orders</div><p style="color:var(--ink-3);">Loading your orders…</p></div>`;
  try {
    userOrders = await api.getUserOrders(currentUser.id);
  } catch (e) {
    userOrders = [];
    main.innerHTML = `<div class="acc-panel"><div class="acc-panel-title">My Orders</div><p style="color:var(--error);">${e.message}</p></div>`;
    return;
  }
  main.innerHTML = buildOrders();
  setTimeout(renderOTPBoxes, 50);
}

function buildProfile() {
  return `
    <div class="acc-panel">
      <div class="acc-panel-title">Profile Information</div>
      <div class="profile-photo-wrap">
        <div class="profile-photo-big" id="prof-photo" onclick="document.getElementById('prof-photo-input').click()">
          ${currentUser.photo ? `<img src="${currentUser.photo}">` : currentUser.name?.[0]?.toUpperCase() || '👤'}
        </div>
        <input type="file" id="prof-photo-input" accept="image/*" style="display:none" onchange="updatePhoto(this)">
        <div>
          <div style="font-size:0.88rem;font-weight:600;">${currentUser.name}</div>
          <div style="font-size:0.78rem;color:var(--ink-2);margin-top:4px;">Click photo to update</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Full Name</label><input type="text" id="p-name" value="${currentUser.name || ''}"></div>
        <div class="form-group"><label>Phone</label><input type="tel" id="p-phone" value="${currentUser.phone || ''}"></div>
      </div>
      <div class="form-group"><label>Email</label><input type="email" id="p-email" value="${currentUser.email || ''}" readonly style="opacity:0.6;"></div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="p-newsletter" ${currentUser.newsletter ? 'checked' : ''} style="accent-color:var(--blue);width:16px;height:16px;">
        <label for="p-newsletter" style="font-size:0.84rem;color:var(--ink-2);text-transform:none;letter-spacing:0;">Receive offers & updates</label>
      </div>
      <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
    </div>`;
}

function updatePhoto(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    const res = await savePhotoToProfile(e.target.result);
    if (res.success) {
      currentUser = res.user;
      loadSidebar();
      showPanel('profile');
      showToast('Photo updated!', 'success');
    } else showToast(res.error, 'error');
  };
  reader.readAsDataURL(file);
}

async function saveProfile() {
  const name = document.getElementById('p-name').value.trim();
  const phone = document.getElementById('p-phone').value.trim();
  const newsletter = document.getElementById('p-newsletter').checked;
  if (!name) { showToast('Name cannot be empty', 'error'); return; }
  const res = await updateProfile({ name, phone, newsletter });
  if (res.success) {
    currentUser = res.user;
    loadSidebar();
    showToast('Profile updated!', 'success');
  } else showToast(res.error, 'error');
}

function buildOrders() {
  const orders = userOrders;
  if (orders.length === 0) return `
    <div class="acc-panel">
      <div class="acc-panel-title">My Orders</div>
      <div class="empty-state">
        <div class="empty-icon">📦</div>
        <h3>No orders yet</h3>
        <p>Start shopping to see your orders here</p>
        <a href="shop.html" class="btn btn-primary">Shop Now</a>
      </div>
    </div>`;

  return `
    <div class="acc-panel">
      <div class="acc-panel-title">My Orders (${orders.length})</div>
      ${orders.map(o => `
        <div class="order-item">
          <div class="order-header">
            <div>
              <div class="order-id">Order #${o.id}</div>
              <div class="order-date">${new Date(o.placedAt).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
            </div>
            <span class="order-status status-${o.status.toLowerCase()}">${o.status}</span>
          </div>
          <div class="order-products">
            ${o.items.map(i => `<div class="order-prod-chip">${i.emoji} ${i.productName}</div>`).join('')}
          </div>
          <div style="font-size:0.8rem;color:var(--ink-2);margin-bottom:12px;">
            📍 ${o.address.city} · 🚚 Expected: ${o.expectedDelivery} · Tracking: ${o.trackingId}<br>
            💳 ${o.payment === 'upi' ? 'UPI' : o.payment === 'coupon' ? 'Coupon / Store Credit' : 'Cash on Delivery'}${o.couponCode ? ` · 🎟️ ${o.couponCode}` : ''}
          </div>
          <div id="otp-container-${o.id}"></div>
          <div class="order-footer">
            <div class="order-total">${formatPrice(o.total)}</div>
            <div class="order-actions">
              <a href="track.html?id=${o.id}" class="btn btn-secondary btn-sm">Track</a>
              ${o.status === 'Confirmed' ? `<button class="btn btn-danger btn-sm" onclick="cancelOrder('${o.id}')">Cancel</button>` : ''}
            </div>
          </div>
        </div>
      `).join('')}
    </div>`;
}

function buildAddresses() {
  const addrs = currentUser.addresses || [];
  return `
    <div class="acc-panel">
      <div class="acc-panel-title">Saved Addresses (${addrs.length}/3)</div>
      ${addrs.map(a => `
        <div class="addr-manage-card ${a.isDefault ? 'default-addr' : ''}">
          ${a.isDefault ? '<div class="default-badge">✓ Default Address</div>' : ''}
          <div style="font-weight:600;font-size:0.92rem;">${a.name} · ${a.phone}</div>
          <div style="font-size:0.84rem;color:var(--ink-2);margin-top:4px;">${a.line1}, ${a.city}, ${a.state} — ${a.pincode}</div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            ${!a.isDefault ? `<button class="btn btn-secondary btn-sm" onclick="setDefault('${a.id}')">Set Default</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteAddr('${a.id}')">Remove</button>
          </div>
        </div>
      `).join('')}
      ${addrs.length < 3 ? `
        <button class="btn btn-ghost" onclick="showAddForm()" id="add-addr-btn">+ Add New Address</button>
        <div id="new-addr-form" style="display:none;margin-top:16px;background:var(--bg);border-radius:var(--radius-md);padding:20px;">
          <div class="form-row">
            <div class="form-group"><label>Name</label><input type="text" id="na-name"></div>
            <div class="form-group"><label>Phone</label><input type="tel" id="na-phone"></div>
          </div>
          <div class="form-group"><label>Address</label><input type="text" id="na-line1"></div>
          <div class="form-row">
            <div class="form-group"><label>City</label><input type="text" id="na-city"></div>
            <div class="form-group"><label>Pincode</label><input type="text" id="na-pin" maxlength="6"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>State</label><input type="text" id="na-state"></div>
            <div class="form-group"><label>Label</label><select id="na-label"><option>Home</option><option>Work</option><option>Other</option></select></div>
          </div>
          <button class="btn btn-primary" onclick="saveNewAddr()">Save Address</button>
        </div>` : '<p style="font-size:0.82rem;color:var(--ink-3);">Maximum 3 addresses reached</p>'}
    </div>`;
}

function buildCoupons() {
  const refundCoupons = currentUser.refundCoupons?.filter(c => !c.used) || [];
  return `
    <div class="acc-panel">
      <div class="acc-panel-title">My Coupons</div>
      <div style="margin-bottom:24px;">
        <div style="font-size:0.82rem;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;">Active Promotional Codes</div>
        ${VANTAIR.coupons.map(c => `
          <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:8px;border:1.5px dashed rgba(0,51,204,0.2);">
            <div>
              <div style="font-weight:700;color:var(--blue);font-size:0.95rem;">${c.code}</div>
              <div style="font-size:0.78rem;color:var(--ink-2);margin-top:3px;">${c.desc}</div>
            </div>
            <button onclick="navigator.clipboard?.writeText('${c.code}');showToast('Copied!','success')" class="btn btn-ghost btn-sm">Copy</button>
          </div>`).join('')}
      </div>
      ${refundCoupons.length > 0 ? `
        <div>
          <div style="font-size:0.82rem;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;">Your Refund Coupons</div>
          ${refundCoupons.map(c => `
            <div style="display:flex;align-items:center;justify-content:space-between;background:#d1fae5;border-radius:var(--radius-md);padding:14px 18px;margin-bottom:8px;">
              <div>
                <div style="font-weight:700;color:#065f46;">${c.code} — ₹${c.value} off</div>
                <div style="font-size:0.76rem;color:#047857;">Expires: ${c.expiry || 'No expiry'}</div>
              </div>
              <button onclick="navigator.clipboard?.writeText('${c.code}');showToast('Copied!','success')" class="btn btn-sm" style="background:#065f46;color:#fff;border:none;padding:6px 14px;border-radius:var(--radius-pill);cursor:pointer;">Copy</button>
            </div>`).join('')}
        </div>` : ''}
    </div>`;
}

function buildSecurity() {
  return `
    <div class="acc-panel">
      <div class="acc-panel-title">Security Settings</div>
      <h4 style="font-size:0.92rem;font-weight:600;margin-bottom:16px;">Change Password</h4>
      <div class="form-group"><label>Current Password</label><input type="password" id="cur-pw" placeholder="Current password"></div>
      <div class="form-group"><label>New Password</label><input type="password" id="new-pw" placeholder="New password (min 8 chars)"></div>
      <div class="form-group"><label>Confirm New Password</label><input type="password" id="conf-pw" placeholder="Confirm new password"></div>
      <button class="btn btn-primary" onclick="handleChangePW()">Update Password</button>
      <div class="divider"></div>
      <h4 style="font-size:0.92rem;font-weight:600;margin-bottom:12px;">OTP Security</h4>
      <p style="font-size:0.84rem;color:var(--ink-2);line-height:1.65;">Your delivery OTP is protected by your account password. It is shown for only 10 seconds and can be viewed a maximum of 3 times per order. This ensures only you can receive your delivery.</p>
    </div>`;
}

async function cancelOrder(orderId) {
  if (!confirm('Are you sure you want to cancel this order?')) return;
  try {
    await api.updateOrderStatus(orderId, 'Cancelled');
    // Refresh the user so any refund coupon returned on cancel shows up.
    if (typeof refreshSessionUser === 'function') {
      try { currentUser = await refreshSessionUser() || currentUser; } catch (e) {}
    }
    showToast('Order cancelled. Any coupon you used has been returned to your account.', 'success');
    showPanel('orders');
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function setDefault(id) {
  const res = await setDefaultAddress(id);
  if (res.success) { currentUser = res.user; showPanel('addresses'); showToast('Default address updated', 'success'); }
  else showToast(res.error, 'error');
}
async function deleteAddr(id) {
  if (!confirm('Remove this address?')) return;
  const res = await removeAddress(id);
  if (res.success) { currentUser = res.user; showPanel('addresses'); showToast('Address removed'); }
  else showToast(res.error, 'error');
}
function showAddForm() { document.getElementById('new-addr-form').style.display = 'block'; document.getElementById('add-addr-btn').style.display = 'none'; }
async function saveNewAddr() {
  const res = await addAddress({
    name: document.getElementById('na-name').value.trim(),
    phone: document.getElementById('na-phone').value.trim(),
    line1: document.getElementById('na-line1').value.trim(),
    city: document.getElementById('na-city').value.trim(),
    pincode: document.getElementById('na-pin').value.trim(),
    state: document.getElementById('na-state').value.trim(),
    label: document.getElementById('na-label').value
  });
  if (res.success) { currentUser = res.user; showPanel('addresses'); showToast('Address added!', 'success'); }
  else showToast(res.error, 'error');
}
async function handleChangePW() {
  const cur = document.getElementById('cur-pw').value;
  const nw  = document.getElementById('new-pw').value;
  const cf  = document.getElementById('conf-pw').value;
  if (nw.length < 8) { showToast('Password must be 8+ characters', 'error'); return; }
  if (nw !== cf) { showToast('Passwords do not match', 'error'); return; }
  const res = await changePassword(cur, nw);
  if (res.success) showToast('Password updated!', 'success');
  else showToast(res.error, 'error');
}

// Render OTP boxes after orders loaded (uses the API-fetched userOrders).
function renderOTPBoxes() {
  userOrders.forEach(o => {
    const container = document.getElementById('otp-container-' + o.id);
    if (container && o.status !== 'Delivered' && o.status !== 'Cancelled') {
      renderOTPBox('otp-container-' + o.id, o.id, o);
    }
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

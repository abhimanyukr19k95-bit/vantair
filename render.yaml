databases:
  - name: vantair-db
    databaseName: vantair
    user: vantair_user
    plan: free
    region: singapore
    ipAllowList: []

services:
  # Spring Boot Backend API
  - type: web
    name: vantair-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./vantair-backend/Dockerfile
    healthCheckPath: /api/products
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: vantair-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: vantair-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: vantair-db
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: VANTAIR_CORS_ALLOWED_ORIGINS
        value: "*"

  # React Frontend (Static Site)
  - type: web
    name: vantair
    runtime: static
    plan: free
    region: singapore
    rootDir: VANTAIR-Website-Complete
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://vantair-api.onrender.com/api/:splat
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

server:
  port: 8080

spring:
  application:
    name: vantair-api
  datasource:
    url: jdbc:postgresql://localhost:5432/vantair
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # Keep the session open through view rendering so lazy collections
    # (variants, benefits, order items, addresses) serialize without extra fetch joins.
    open-in-view: true
    show-sql: false

# Swagger UI at /swagger-ui.html, raw spec at /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Comma-separated origins allowed to call the API (the static storefront, when served).
vantair:
  cors:
    allowed-origins: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,null"
